<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我们的恋爱小屋</title>
  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, sans-serif;
    }
    body {
      background-color: #fceef5;
      padding: 24px;
      margin:0;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    .header-title {
      text-align:center;
    }
    .header-title h1{
      color:#d2648c;
      margin:0;
      font-size:28px;
    }
    .user-info{
      text-align:center;
      color:#555;
      margin-bottom:24px;
      font-size:18px;
    }
    .tab-wrap{
      display:flex;
      border-radius:12px;
      overflow:hidden;
      margin-bottom:20px;
    }
    .tab-item{
      flex:1;
      padding:14px;
      text-align:center;
      background:#f7d9e6;
      border:none;
      font-size:18px;
      cursor:pointer;
      color:#777;
    }
    .tab-item.active{
      background:#fff;
      color:#c24e78;
      font-weight:bold;
    }
    .panel{
      display:none;
      background:#fff;
      padding:24px;
      border-radius:16px;
      margin-bottom:16px;
    }
    .panel.active{
      display:block;
    }
    textarea,input{
      width:100%;
      padding:14px;
      border:1px solid #f2c8d8;
      border-radius:10px;
      margin:8px 0;
      font-size:16px;
    }
    button{
      background:#c24e78;
      color:white;
      border:none;
      padding:12px 24px;
      border-radius:10px;
      font-size:16px;
      cursor:pointer;
    }
    .diary-record-block{
      background:#fff;
      padding:20px;
      border-radius:16px;
      cursor:pointer;
    }
    .diary-item{
      border-bottom:1px solid #f2d0df;
      padding:12px 0;
    }
    .auth-box{
      background:#fff;
      padding:24px;
      border-radius:16px;
      max-width:450px;
      margin:20px auto;
    }
  </style>
</head>
<body>
<div class="container">
  <div class="header-title">
    <h1>💖我们的恋爱小屋</h1>
  </div>
  <div class="user-info">当前登录：<span id="user-info">加载中...</span></div>

  <!-- 登录面板 -->
  <div id="auth-panel" class="auth-box">
    <h3>登录 / 注册</h3>
    <input type="email" id="login-email" placeholder="邮箱">
    <input type="password" id="login-pwd" placeholder="密码">
    <div style="display:flex;gap:10px;margin-top:10px;">
      <button onclick="signIn()">登录</button>
      <button onclick="signUp()">注册</button>
      <button onclick="signOut()">退出登录</button>
    </div>
  </div>

  <!-- Tab标签 -->
  <div class="tab-wrap">
    <button class="tab-item active" data-tab="diary">生活日记</button>
    <button class="tab-item" data-tab="flower">小红花奖励</button>
    <button class="tab-item" data-tab="wish">许愿礼物</button>
  </div>

  <!-- 生活日记面板 -->
  <div class="panel active" id="panel-diary">
    <h3>📝写新日记</h3>
    <textarea id="diary-content" rows="5" placeholder="记录今天的小故事..."></textarea>
    <input type="text" id="diary-mood" placeholder="心情（例如：开心）">
    <button onclick="saveDiary()">保存日记</button>
  </div>

  <!-- 小红花面板（预留） -->
  <div class="panel" id="panel-flower">
    <h3>🌸小红花奖励</h3>
    <p>小红花功能待开发</p>
  </div>

  <!-- 许愿面板（预留） -->
  <div class="panel" id="panel-wish">
    <h3>🎁许愿礼物</h3>
    <p>许愿清单功能待开发</p>
  </div>

  <!-- 时光记录区域 -->
  <div class="diary-record-block" onclick="loadDiaryList()">
    <h3>📖时光记录</h3>
    <div id="diary-list"></div>
  </div>
</div>

<script>
// ===================== Supabase 配置（已填好你的信息）=====================
const SUPABASE_URL = "https://bxiiapjcghlvyfgpfjhi.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_mQ_pZNPxV_lOYTGmVBzojg_27dBUx1G";
// ==========================================================================

// 创建客户端实例 sb
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Tab切换
document.querySelectorAll(".tab-item").forEach(tab=>{
  tab.onclick = function(){
    const tabName = this.dataset.tab;
    document.querySelectorAll(".tab-item").forEach(t=>t.classList.remove("active"));
    document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));
    this.classList.add("active");
    document.getElementById("panel-"+tabName).classList.add("active");
  }
})

// 页面初始化
async function init(){
  await refreshUser();
}

// 刷新用户信息，修复null问题
async function refreshUser(){
  const {data:{user}} = await sb.auth.getUser();
  const userDom = document.getElementById("user-info");
  const authPanel = document.getElementById("auth-panel");
  if(user){
    authPanel.style.display = "none";
    // 读取profiles表的nickname
    const {data:profile} = await sb.from("profiles").select("nickname").eq("id",user.id).single();
    const name = profile?.nickname || user.email;
    userDom.innerText = name;
  }else{
    authPanel.style.display = "block";
    userDom.innerText = "未登录";
  }
}

// 登录
async function signIn(){
  const email = document.getElementById("login-email").value;
  const password = document.getElementById("login-pwd").value;
  const {error} = await sb.auth.signInWithPassword({email,password});
  if(error) alert(error.message);
  await refreshUser();
}
// 注册
async function signUp(){
  const email = document.getElementById("login-email").value;
  const password = document.getElementById("login-pwd").value;
  const {error} = await sb.auth.signUp({email,password});
  if(error) alert(error.message);
  await refreshUser();
}
// 退出登录
async function signOut(){
  await sb.auth.signOut();
  await refreshUser();
}

// 保存日记，diaries表，author_id
async function saveDiary(){
  const {data:{user}} = await sb.auth.getUser();
  if(!user){
    alert("请先登录");
    return;
  }
  const content = document.getElementById("diary-content").value.trim();
  const mood = document.getElementById("diary-mood").value.trim();
  if(!content){
    alert("日记内容不能为空");
    return;
  }
  const {error} = await sb.from("diaries").insert({
    author_id: user.id,
    content: content,
    mood: mood
  })
  if(error){
    console.error(error);
    alert("保存失败："+error.message);
  }else{
    alert("✅日记保存成功！");
    document.getElementById("diary-content").value = "";
    document.getElementById("diary-mood").value = "";
    loadDiaryList();
  }
}

// 读取日记列表（时光记录）
async function loadDiaryList(){
  const {data:{user}} = await sb.auth.getUser();
  if(!user){
    alert("请先登录查看日记");
    return;
  }
  const {data:diaryList,error} = await sb.from("diaries")
    .select("*")
    .order("created_at",{ascending:false});
  if(error){
    console.error(error);
    alert("读取日记失败："+error.message);
    return;
  }
  const container = document.getElementById("diary-list");
  container.innerHTML = "";
  if(diaryList.length ===0){
    container.innerHTML = "<p>暂无日记记录</p>";
    return;
  }
  diaryList.forEach(item=>{
    const time = new Date(item.created_at).toLocaleString();
    container.innerHTML += `
      <div class="diary-item">
        <div>${time}</div>
        <div>心情：${item.mood||"无"}</div>
        <div>${item.content}</div>
      </div>
    `
  })
}

// 页面加载执行
init();
</script>
</body>
</html>
